apiVersion: pulltide.io/v1alpha1
kind: Application
metadata:
  name: example
spec:
  source:
    type: git
    url: https://example.com/team/app.git
    ref: refs/heads/main
  runtime:
    type: exec
    exec:
      apply: [yes, no, on, off, 2026-10-22, "true", "0010", !!str true]
      stop: [stop]
  health:
    checks:
    - type: http
      url: http://127.0.0.1:8080/health
