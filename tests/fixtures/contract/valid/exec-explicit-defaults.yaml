apiVersion: pulltide.io/v1alpha1
kind: Application
metadata:
  name: example
spec:
  source:
    type: git
    url: https://example.com/team/app.git
    ref: refs/heads/main
    path: .
  runtime:
    type: exec
    exec:
      apply:
      - ./deploy.sh
      stop:
      - ./stop.sh
      env: {}
  health:
    checks:
    - type: http
      url: http://127.0.0.1:8080/health
      timeoutSeconds: 5
    timeoutSeconds: 60
    intervalSeconds: 5
  reconcile:
    intervalSeconds: 30
    operationTimeoutSeconds: 300
  rollback:
    enabled: true
