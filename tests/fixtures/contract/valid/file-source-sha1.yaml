apiVersion: pulltide.io/v1alpha1
kind: Application
metadata:
  name: example
spec:
  source:
    type: git
    url: file:///srv/repos/app.git
    ref: ABCDEF0123456789ABCDEF0123456789ABCDEF01
  runtime:
    type: exec
    exec:
      apply:
      - ./deploy.sh
      stop:
      - ./stop.sh
  health:
    checks:
    - type: http
      url: http://127.0.0.1:8080/health
