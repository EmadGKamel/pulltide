apiVersion: pulltide.io/v1alpha1
kind: Application
metadata:
  name: example
spec:
  source:
    type: git
    url: https://example.com/team/app.git
    ref: refs/heads/a..b
  runtime:
    type: exec
    exec:
      apply:
      - ./deploy.sh
      stop:
      - ./stop.sh
  health:
    checks:
    - type: http
      url: http://127.0.0.1:8080/health
